name: Cross-browser regression

on:
  pull_request:
  push:
    branches:
      [
        main,
        codex/phase-19-verified-content,
        codex/final-pre-vercel-readiness,
        codex/final-security-hygiene-testing,
      ]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e:cross-browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4 --reporter=line
      - name: Verify closure proxies on the installed browser
        if: matrix.shard == 1
        env:
          CLOSURE_BROWSER: ${{ matrix.browser }}
        run: |
          case "$CLOSURE_BROWSER" in
            chromium) npm run test:closure -- --project=closure-chromium --project=android-chromium --project=android-tablet-chromium ;;
            webkit) npm run test:closure -- --project=closure-webkit --project=iphone-webkit --project=ipad-webkit ;;
            firefox) npm run test:closure -- --project=closure-firefox ;;
          esac
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
