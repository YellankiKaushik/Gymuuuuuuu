name: Release candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:privacy
      - run: npm audit --audit-level=high
      - name: State deployment boundary
        run: echo 'Automated checks do not deploy or promote the app. Vercel Preview, domain/TLS, owner backup, manual accessibility and production smoke remain separate release gates.'
