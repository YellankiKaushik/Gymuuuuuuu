<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="title desc"><title id="title">Leg extension sequence cue</title><desc id="desc">Original sequence cue: Align seat and pad, then Extend without locking, then Lower under control. Read the complete technique and prerequisites.</desc><rect width="640" height="210" rx="16" fill="#101827"/><g fill="#edf5ff" font-family="sans-serif" text-anchor="middle"><text x="320" y="35" font-size="21">Leg extension</text><rect x="20" y="60" width="184" height="95" rx="12" fill="#203c52"/><text x="112" y="93" font-size="24">1</text><text x="112" y="127" font-size="13">Align seat and pad</text><rect x="228" y="60" width="184" height="95" rx="12" fill="#203c52"/><text x="320" y="93" font-size="24">2</text><text x="320" y="127" font-size="13">Extend without locking</text><rect x="436" y="60" width="184" height="95" rx="12" fill="#203c52"/><text x="528" y="93" font-size="24">3</text><text x="528" y="127" font-size="13">Lower under control</text><text x="320" y="187" font-size="12">Sequence cue only. Read the full source-specific instructions.</text></g></svg>
