<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc"><title id="title">Elbow flexion schematic</title><desc id="desc">Two schematic arms show the upper arm remaining beside the body while the elbow bends. A movement cue, not an anatomical model.</desc><rect width="480" height="240" rx="16" fill="#f1f5f9"/><g fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round"><path d="M110 55V132L115 195"/><path d="M340 55V132L385 80"/></g><g fill="#0f766e"><circle cx="110" cy="132" r="9"/><circle cx="340" cy="132" r="9"/></g><g fill="#0f172a" font-family="sans-serif" font-size="17"><text x="72" y="30">Start</text><text x="309" y="30">Bend</text><text x="18" y="225">Schematic cue: upper arm beside the body.</text></g></svg>
