<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img" aria-labelledby="title desc"><title id="title">Bird dog sequence</title><desc id="desc">Original movement sequence cue; not an anatomical model or complete technique demonstration.</desc><rect width="600" height="210" rx="16" fill="#f1f5f9"/><rect x="20" y="38" width="170" height="102" rx="12" fill="#fff" stroke="#0f172a"/><text x="32" y="69" font-family="sans-serif" font-size="20" fill="#0369a1">1</text><text x="32" y="103" font-family="sans-serif" font-size="11" fill="#0f172a">Hands and knees supported</text><rect x="215" y="38" width="170" height="102" rx="12" fill="#fff" stroke="#0f172a"/><text x="227" y="69" font-family="sans-serif" font-size="20" fill="#0369a1">2</text><text x="227" y="103" font-family="sans-serif" font-size="11" fill="#0f172a">Opposite arm and leg reach</text><rect x="410" y="38" width="170" height="102" rx="12" fill="#fff" stroke="#0f172a"/><text x="422" y="69" font-family="sans-serif" font-size="20" fill="#0369a1">3</text><text x="422" y="103" font-family="sans-serif" font-size="11" fill="#0f172a">Lower and alternate</text><text x="20" y="182" font-family="sans-serif" font-size="13" fill="#0f172a">Sequence cue only; read the full source and written prerequisites.</text></svg>
